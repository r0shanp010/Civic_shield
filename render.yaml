services:
  # -------------------------------------------------------------------
  # Backend Web Service (FastAPI + AI Engine)
  # -------------------------------------------------------------------
  - type: web
    name: civicshield-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: UPLOAD_DIR
        value: uploads

  # -------------------------------------------------------------------
  # Frontend Static Site (React Vite SPA)
  # -------------------------------------------------------------------
  - type: staticSite
    name: civicshield-frontend
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: civicshield-backend
          property: host
